# Caches Cargo dependencies and build artifacts.
#
# Avoid using this action for release builds and build from scratch instead!
name: "Cargo cache"

inputs:
  name:
    description: "The cache name."
    default: build

runs:
  using: composite
  steps:
  - uses: actions/cache@v6.1.0
    with:
      path: ~/.rustup/toolchains/nightly-*
      key: toolchain-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

  - uses: actions/cache@v6.1.0
    with:
      path: |
        ~/.cargo/registry/index
        ~/.cargo/registry/cache
        target
        apps/*/target
      key: ${{ inputs.name }}-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('Cargo.lock', 'apps/*/Cargo.lock', 'rust-toolchain.toml') }}
      restore-keys: |
        ${{ inputs.name }}-${{ runner.os }}-${{ github.ref_name }}-
        ${{ inputs.name }}-${{ runner.os }}-main-
