[workspace.package]
version = "0.0.0"
authors = ["Seiya Nuta <nuta@seiya.me>"]
edition = "2024"

[workspace]
resolver = "2"
members = ["kernel", "libs/*", "drivers/*", "lx"]

[workspace.dependencies]
ftl = { path = "libs/ftl" }
ftl_utils = { path = "libs/ftl_utils" }
ftl_bitmap_allocator = { path = "libs/ftl_bitmap_allocator" }
ftl_arrayvec = { path = "libs/ftl_arrayvec" }
ftl_malloc = { path = "libs/ftl_malloc" }
ftl_elf = { path = "libs/ftl_elf" }
ftl_types = { path = "libs/ftl_types" }
ftl_virtio = { path = "libs/ftl_virtio" }
ftl_driver = { path = "libs/ftl_driver" }
ftl_netmux = { path = "libs/ftl_netmux" }
virtio_net = { path = "drivers/virtio_net" }
hashbrown = "0.17.1"
rustc-hash = { version = "2.1", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"
